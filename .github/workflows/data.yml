name: oracle-mirror
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch quotes
        run: |
          mkdir -p docs/data
          node scripts/fetch-quotes.mjs
      - name: Commit data
        run: |
          git config user.name "stocknine-bot"
          git config user.email "stocknine-bot@users.noreply.github.com"
          git add docs/data/quotes.json
          git diff --cached --quiet || git commit -m "chore: refresh quotes"
          git push
